name: Sync and convert rules

on:
  workflow_dispatch:
  push:
    paths:
      - "config/sources.json"
      - "scripts/sync.py"
      - ".github/workflows/sync.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and convert every Loon rule
        run: |
          python3 -m py_compile scripts/sync.py
          python3 scripts/sync.py
      - name: Commit changed rule providers
        run: |
          if git diff --quiet; then
            echo "No rule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules
          git commit -m "chore: sync Surge and Clash rule sets"
          git push
